[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postmortem-copilot"
version = "0.1.0"
description = "Turn incident timelines into blameless postmortem drafts with an LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shiva Sampathi" }]
keywords = ["sre", "incident", "postmortem", "llm", "oncall"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Repository = "https://github.com/shivareddy519/postmortem-copilot"

[project.scripts]
pmc = "postmortem_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
